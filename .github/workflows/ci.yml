name: CI

on:
  # every branch, so work is checked before it reaches main (docs/15 P0.4); a v* tag also
  # publishes a release once every job is green (docs/15 P2.4)
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install the locked, hash-checked dependency set (docs/15 P2.4)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
          pip check
      - name: Lint and format (ruff)
        run: |
          ruff check hos tests scripts
          ruff format --check hos tests scripts
      - name: Type check (mypy)
        run: mypy hos
      - name: Migrations (empty database to head; no drift from the models)
        run: hos-db upgrade && hos-db check
        env:
          HOS_DATABASE_URL: sqlite:///${{ runner.temp }}/migrations.sqlite3
          HOS_DATA_DIR: ${{ runner.temp }}/hos-migrations
      - name: Tests (offline; recorded real API responses)
        run: pytest -m "not live"
      - name: End-to-end demo
        run: python scripts/demo.py --out demo-out
        env:
          HOS_DATA_DIR: ${{ runner.temp }}/hos-ci
      - name: Verify the demo's Module 4 export offline
        run: hos-verify demo-out/module4.zip

  postgres:
    # the same suite on PostgreSQL 16 (docs/15 P2.2); every test database is a fresh schema
    name: backend on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hos
          POSTGRES_DB: hos_test
          POSTGRES_HOST_AUTH_METHOD: trust       # a throwaway service container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hos" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      HOS_TEST_DATABASE_URL: postgresql+psycopg://hos@localhost:5432/hos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install the locked, hash-checked dependency set (docs/15 P2.4)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
          pip check
      - name: Migrations (empty database to head; no drift from the models)
        run: hos-db upgrade && hos-db check
        env:
          HOS_DATABASE_URL: postgresql+psycopg://hos@localhost:5432/hos_test
          HOS_DATA_DIR: ${{ runner.temp }}/hos-migrations
      - name: Tests on PostgreSQL
        run: pytest -m "not live"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  containers:
    # the deployment as shipped (docs/15 P2.3): build both images, start the compose stack and
    # drive it through the web container
    name: containers (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure secrets for this run
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "HOS_BOOTSTRAP_TOKEN=$(openssl rand -hex 24)"
            echo "HOS_ANCHOR_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait until ready
        run: |
          for i in $(seq 60); do
            curl -fsS http://localhost:8080/api/ready && exit 0
            sleep 5
          done
          exit 1
      - name: Smoke test through the web container
        run: |
          set -a; . ./.env; set +a
          python3 backend/scripts/smoke.py http://localhost:8080
      - name: Migrations are idempotent; the schema has no drift
        run: |
          docker compose run --rm migrate
          docker compose exec -T api hos-db check
      - name: Integrity check passes; the API logs structured lines with request IDs
        run: |
          docker compose exec -T api hos-db integrity
          docker compose logs api | grep -q '"msg": "request"'
          docker compose logs api | grep -q '"request_id"'
      - name: Containers run as non-root
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: The API is reachable only through the web container
        run: "! curl -fsS --max-time 3 http://localhost:8000/api/health"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  artifacts:
    # what a release ships, built on every run so it never breaks unnoticed (docs/15 P2.4):
    # the wheel, the locked runtime set, CycloneDX SBOMs and the versions hos-verify records
    name: release artifacts (wheel, SBOMs, versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Runtime environment from the lock, as in the image
        working-directory: backend
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --require-hashes -r requirements.lock
          /tmp/runtime/bin/pip wheel --no-deps --wheel-dir ../release .
          /tmp/runtime/bin/pip install --no-deps ../release/*.whl
          /tmp/runtime/bin/pip check
          cp requirements.lock ../release/
      - name: Versions recorded by hos-verify
        run: >
          /tmp/runtime/bin/python -c "import json; from hos.verify.bundle import software_versions;
          print(json.dumps(software_versions(), indent=2, sort_keys=True))"
          > release/software-versions.json
      - name: SBOM, backend (CycloneDX)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install "cyclonedx-bom==7.4.0"
          /tmp/sbom/bin/cyclonedx-py environment /tmp/runtime/bin/python \
            --pyproject backend/pyproject.toml --of JSON --output-reproducible --validate \
            -o release/sbom-backend.cdx.json
      - name: SBOM, web app (CycloneDX)
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-reproducible --validate \
            --output-format JSON --output-file ../release/sbom-web.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, postgres, frontend, containers, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes "Wheel, locked runtime dependencies,
          CycloneDX SBOMs (backend and web app) and the software versions hos-verify records.
          Built after every CI job passed."
