name: CI

on:
  # every branch, so work is checked before it reaches main (docs/15 P0.4)
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[api,db,dev]"
      - name: Lint (ruff)
        run: ruff check hos tests scripts
      - name: Type check (mypy)
        run: mypy hos
      - name: Migrations (empty database to head; no drift from the models)
        run: hos-db upgrade && hos-db check
        env:
          HOS_DATABASE_URL: sqlite:///${{ runner.temp }}/migrations.sqlite3
          HOS_DATA_DIR: ${{ runner.temp }}/hos-migrations
      - name: Tests (offline; recorded real API responses)
        run: pytest -m "not live"
      - name: End-to-end demo
        run: python scripts/demo.py --out demo-out
        env:
          HOS_DATA_DIR: ${{ runner.temp }}/hos-ci
      - name: Verify the demo's Module 4 export offline
        run: hos-verify demo-out/module4.zip

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
