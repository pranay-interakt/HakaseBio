name: Deploy HakaseAI demo to GitHub Pages

on:
  push:
    branches: [staging]
    paths:
      - sample_demo/hakase-demo/**
      - .github/workflows/deploy-sample-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_demo/hakase-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sample_demo/hakase-demo/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /HakaseBio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sample_demo/hakase-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
