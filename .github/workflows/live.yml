name: Live contracts

# The tests that need the outside world (CLAUDE.md rule 7; docs/15 P3): ChEMBL and PubChem
# still answer the way the recorded fixtures say, and every citation's DOI and URL still
# resolves to the cited work. Weekly, and on demand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install the locked dependency set
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Live tests
        run: pytest -m live
