[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakase-os"
version = "0.1.0"
description = "Hakase Operating System - preclinical drug development kernel"
requires-python = ">=3.11"
dependencies = [
  "rdkit>=2024.3.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pint>=0.23",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "xmlschema>=3.4",
]

[project.scripts]
hos-verify = "hos.verify.cli:main"
hos-db = "hos.db.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db  = ["sqlalchemy>=2.0", "alembic>=1.13"]
pg  = ["psycopg[binary]>=3.1"]
# pandas is a second, independent XPORT reader for the SEND tests.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.9", "ruff>=0.4", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hos*"]

[tool.setuptools.package-data]
# SENDIG v3.1.1 metadata, SEND CT and the CDISC Define-XML 2.1 schemas (hos/send/schemas/PROVENANCE.md).
# Alembic revisions are loaded by path, not imported as a package.
"hos.db.migrations" = ["script.py.mako", "versions/*.py"]
"hos.send" = ["reference/*.json", "schemas/LICENSE", "schemas/PROVENANCE.md",
              "schemas/define2-1.xsl", "schemas/define/2.1/*.xsd", "schemas/odm/1.3.2/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
  "live: tests that require outbound network to external scientific APIs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results do not change with ruff's defaults.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "ISC"]
ignore = [
  "ISC004",  # multi-line string literals inside tuples are intentional (method assumptions/limits)
  "E501",    # line length is advisory; long citations and user-facing messages are kept whole
  "RUF005",  # list concatenation vs unpacking is a style preference
  "UP042",   # (str, Enum) kept: StrEnum changes str() of members, which can reach hashed records
]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection is declared with Depends() in argument defaults by design.
"hos/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# RDKit ships partial type stubs that omit many functions present at runtime
# (Descriptors.MolWt, Crippen.MolLogP, RDLogger.DisableLog, ...). Treat it as untyped.
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The RDKit stubs that ship in the wheel are partial, so attribute lookups on
# RDKit modules are unverifiable; the descriptor tests check them at runtime.
module = ["hos.core.descriptors"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# SciPy publishes no inline type information.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

