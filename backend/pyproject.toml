[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakase-os"
version = "0.1.0"
description = "Hakase Operating System - preclinical drug development kernel"
requires-python = ">=3.10"
dependencies = [
  "rdkit>=2024.3.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pint>=0.23",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db  = ["sqlalchemy>=2.0", "alembic>=1.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.9", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: tests that require outbound network to external scientific APIs",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
