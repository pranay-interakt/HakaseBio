[project]
name = "hakase-structure"
version = "0.1.0"
description = "Shared substrate: 3D structure — co-folding, docking, PDB tooling, protein ML."
requires-python = ">=3.11,<3.14"
dependencies = ["hakase-kernel", "hakase-sequence"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_structure"]
