[project]
name = "hakase-sequence"
version = "0.1.0"
description = "Shared substrate: amino-acid descriptors, physicochemistry, CamSol, ESM embeddings."
requires-python = ">=3.11,<3.14"
dependencies = ["hakase-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_sequence"]
