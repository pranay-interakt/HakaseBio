version: "3.9"
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: hakase/backend:latest
    container_name: hakase-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      AI_SERVICE_PORT: 8090
    ports:
      - "3000:3000"
      - "8090:8090"
    volumes:
      - hakase-data:/var/lib/hakase
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  hakase-data:
