# /etc/nginx/sites-available/hakase-backend.conf
#
# Reverse proxy in front of Express (3000) and FastAPI (8090).
# Only Express is exposed publicly; FastAPI stays internal at /ai/.
upstream hakase_api  { server 127.0.0.1:3000; keepalive 32; }
upstream hakase_ai   { server 127.0.0.1:8090; keepalive 32; }

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 50m;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # SSE-friendly defaults for /api/bio-chat
    proxy_buffering           off;
    proxy_http_version        1.1;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://hakase_api;
    }

    location /ai/ {
        # Internal-only — restrict to your own IPs in production.
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://hakase_ai/;
    }
}
