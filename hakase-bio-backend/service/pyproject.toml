[project]
name = "hakase-service"
version = "0.1.0"
description = "FastAPI composition root — mounts each modality router."
requires-python = ">=3.11,<3.14"
dependencies = [
    "hakase-kernel",
    "hakase-smallmol",
    "hakase-peptide",
    "hakase-antibody",
    "hakase-structure",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_service"]
