[project]
name = "hakase-peptide"
version = "0.1.0"
description = "Peptide modality engine: domain, services, decision, structure."
requires-python = ">=3.11,<3.14"
dependencies = ["hakase-kernel", "hakase-chemistry", "hakase-sequence", "hakase-structure"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_peptide"]
