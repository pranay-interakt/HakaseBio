[project]
name = "hakase-antibody"
version = "0.1.0"
description = "Antibody modality engine: developability properties and IMGT numbering."
requires-python = ">=3.11,<3.14"
dependencies = ["hakase-kernel", "hakase-sequence"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_antibody"]
