[project]
name = "hakase-smallmol"
version = "0.1.0"
description = "Small-molecule modality engine: ADMET, tox, PK, binding."
requires-python = ">=3.11,<3.14"
dependencies = ["hakase-kernel", "hakase-chemistry", "hakase-structure"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakase_smallmol"]
