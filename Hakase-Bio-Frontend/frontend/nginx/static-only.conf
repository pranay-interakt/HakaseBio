# Production nginx for the BUILT SPA — point this at artifacts/hakase-ai/dist
# (or use it inside the Docker image which already copies dist/ to /usr/share/nginx/html).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets, no-cache for index.html
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional proxy: forward /api to the backend.
    # Uncomment + edit if you want a single public origin for both UI and API.
    # location /api/ {
    #     proxy_pass http://api.example.com;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    # }
}
