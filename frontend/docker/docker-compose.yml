version: "3.9"
services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-}
    image: hakase/frontend:latest
    container_name: hakase-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "4000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
